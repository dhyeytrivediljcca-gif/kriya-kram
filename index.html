<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102a20" />
    <meta name="description" content="क्रिया-क्रम — हर काम, सही क्रम में।" />
    <link rel="preload" as="image" href="/brand/kriya-kram-wordmark.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>क्रिया-क्रम — हर काम, सही क्रम में।</title>
    <script>
      const savedTheme = localStorage.getItem('kk-theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', savedTheme === 'dark' ? '#0f2119' : '#102a20');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
